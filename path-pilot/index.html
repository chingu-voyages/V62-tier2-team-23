<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="favicon.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Path Finder</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="/src/style.css"
    />
  </head>

  <body>
    <header class="primary-header">
      <div class="container">
        <div class="nav-wrapper">
          <a href="#"
            ><img
              src="src/images/logo.png"
              alt="logo"
          /></a>
          <button
            class="mobile-nav-toggle"
            aria-controls="primary-navigation"
            aria-expanded="false"
          >
            <img
              class="icon-hamburger"
              src="images/icon-hamburger.svg"
              alt=""
              aria-hidden="true"
            />
            <img
              class="icon-close"
              src="images/icon-close.svg"
              alt=""
              aria-hidden="true"
            />
            <span
              class="visually-hidden"
              >Menu</span
            >
          </button>
          <nav
            class="primary-navigation"
            id="primary-navigation"
          >
            <ul
              aria-label="Primary"
              role="list"
              class="nav-list"
            >
              <li>
                <a href="#">Home</a>
              </li>
            </ul>
          </nav>
          <button
            class="button | display-sm-none display-md-inline-flex"
          >
            Login
          </button>
          <button
            class="button | display-sm-none display-md-inline-flex"
          >
            Sign up
          </button>
        </div>
      </div>
    </header>

    <main>
      <section
        class="padding-block-900"
      >
        <div class="container">
          <div class="even-columns">
            <div class="flow">
              <h1
                class="fs-primary-heading fw-bold"
              >
                Turn Your Goals into a
                Personalized Learning
                Journey
              </h1>
              <p>
                Use AI for a
                step-by-step learning
                path that fits your
                goals, curent skills and
                schedule. Obtain a
                bespoken plan and reach
                your career goals
                faster.
              </p>
              <button class="button">
                Generate Your Learning
                Path
              </button>
            </div>
            <div>
              <img
                src="/src/images/groupPhoto.png"
                alt="groupPhoto"
              />
            </div>
          </div>
        </div>
      </section>

      <section
        class="carousel | padding-block-700"
      >
        <h2
          class="fs-secondary-heading fw-bold"
        >
          Your Learning Path
        </h2>
        
        <!-- Carousel here -->
        <div class="carousel-container">
          <!-- Slides -->
          <div class="carousel-slide">
            <img src="src/images/yourGoal.png" alt="your goal">
          </div>
        
          <div class="carousel-slide">
            <img src="src/images/yourSkill.png" alt="your skill">
          </div>
        
          <div class="carousel-slide">
            <img src="src/images/aiGuidance.png" alt="ai ai guidance">
          </div>

          <div class="carousel-slide">
            <img src="src/images/yourPath.png" alt="your path">
          </div>
      </section>

    <footer
      class="padding-block-700 bg-neutral-900 text-neutral-100"
    >
      <div class="footerContainer">
        <div class="even-columns">
          <div>
            <a href="#"
              ><img
                src="src/images/logo.png"
                alt="pathPilot logo"
            /></a>
            <a href="#">
            <p class="text-decoration:none text-neutral-100">| Github Repo</p>
          </a>
          </div>
        </div>
    </footer>
  </body>
</html>
